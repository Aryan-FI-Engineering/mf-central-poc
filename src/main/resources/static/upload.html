<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAS QR → Portfolio</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<main>
  <h1>Finish your CAS</h1>
  <p class="sub" id="lead">Upload the QR MFCentral downloaded to your machine; we validate it and open your portfolio.</p>

  <section>
    <!-- Auto mode: shown after the portal redirects back with ?status=success&reqId=... -->
    <div id="auto" hidden>
      <p id="autoReq" class="sub"></p>
      <input id="file" type="file" accept="image/*,.pdf" hidden>
      <button type="button" id="pick">Select the QR you just downloaded</button>
      <p id="status"></p>
    </div>

    <!-- Manual mode: direct visit, pick request + file yourself. -->
    <form id="manual" hidden>
      <label for="clientRefNo">CAS request</label>
      <select id="clientRefNo" required></select>
      <label for="fileM">QR file</label>
      <input id="fileM" type="file" accept="image/*,.pdf" required>
      <button type="submit">Fetch CAS &amp; open portfolio</button>
      <p id="statusM"></p>
    </form>
  </section>
</main>

<script>
  const qs = new URLSearchParams(location.search);
  const params = { status: qs.get('status'), reqId: qs.get('reqId'), type: qs.get('type') };

  async function pending() {
    try { return await (await fetch('api/cas-requests?status=AWAITING_QR')).json(); }
    catch { return []; }
  }
  const matchReq = (list, reqId) => list.find(r =>
    reqId && (r.reqId === reqId || String(r.reqId).startsWith(reqId) || reqId.startsWith(String(r.reqId))));

  // Validate the QR for a request, stash the CAS, and open the dashboard.
  async function validateAndOpen(clientRefNo, fileInput, statusEl, btn) {
    const f = fileInput.files[0];
    if (!f) return;
    if (btn) btn.disabled = true;
    statusEl.className = ''; statusEl.textContent = 'Validating QR (validateQRCode)… this can take a while.';
    try {
      const body = new FormData(); body.append('file', f);
      const res = await fetch(`api/cas-requests/${encodeURIComponent(clientRefNo)}/qr`, { method: 'POST', body });
      const json = await res.json();
      if (!res.ok) {
        const mfc = json.mfcErrors ? `\n${JSON.stringify(json.mfcErrors)}` : '';
        throw new Error((json.detail || res.statusText) + mfc);
      }
      statusEl.className = 'ok'; statusEl.textContent = 'CAS received — opening your portfolio…';
      try { sessionStorage.setItem('mfc_cas_pending', JSON.stringify(json)); } catch {}
      location.href = 'cas-report.html';
    } catch (err) {
      statusEl.className = 'error'; statusEl.textContent = err.message;
      if (btn) btn.disabled = false;
    }
  }

  async function initAuto() {
    const auto = document.getElementById('auto');
    const status = document.getElementById('status');
    const file = document.getElementById('file');
    const list = await pending();
    const req = matchReq(list, params.reqId) || list[0];
    auto.hidden = false;
    document.getElementById('lead').textContent =
      'Almost done — pick the QR MFCentral just downloaded, and your portfolio opens automatically.';
    document.getElementById('autoReq').textContent = req
      ? `Request ${req.clientRefNo} · reqId ${req.reqId}${params.type ? ' · ' + params.type : ''}`
      : 'Could not match the request automatically — use manual mode below.';
    if (!req) { showManual(list); return; }
    const pick = document.getElementById('pick');
    pick.addEventListener('click', () => file.click());
    file.addEventListener('change', () => validateAndOpen(req.clientRefNo, file, status, pick));
  }

  function showManual(list) {
    const manual = document.getElementById('manual');
    const select = document.getElementById('clientRefNo');
    const statusM = document.getElementById('statusM');
    const fileM = document.getElementById('fileM');
    manual.hidden = false;
    select.replaceChildren();
    if (!list.length) select.append(new Option('No pending requests — start one first', ''));
    for (const r of list) select.append(new Option(
      `${r.clientRefNo} · reqId ${r.reqId} · ${r.detailed ? 'detailed' : 'summary'} · ${new Date(r.createdAt).toLocaleString()}`,
      r.clientRefNo));
    manual.addEventListener('submit', e => {
      e.preventDefault();
      validateAndOpen(select.value, fileM, statusM, manual.querySelector('button'));
    });
  }

  (async () => {
    if (params.status === 'error') {
      document.getElementById('lead').className = 'error';
      document.getElementById('lead').textContent =
        'MFCentral reported the QR generation failed (status=error). Start a new request from the home page.';
      showManual(await pending());
      return;
    }
    if (params.status === 'success' || params.reqId) initAuto();
    else showManual(await pending());
  })();
</script>
</body>
</html>
