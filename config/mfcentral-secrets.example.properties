# Copy to ~/.mfcentral/secrets.properties (chmod 600) and fill in the values MFCentral shared at onboarding.
# Do not put the real file inside this project directory.

# UAT values from the integration doc. Get the PROD hosts from MFCentral; they are not in the doc.
mfc.base-url=https://uatservices.mfcentral.com
mfc.cas-portal-url=https://mfc-cas-uat.mfcentral.com/

mfc.client-id=
mfc.client-secret=
mfc.username=
mfc.password=

# Shared AES key for API payloads. The app derives the AES-256 key as the first 32 chars of lowercase hex SHA-256(key).
mfc.encryption-key=
# 32-char QR-URL key for the browser handoff (/api/auth/start data=). Used directly as raw AES-256 bytes.
mfc.qr-url-encryption-key=
# The constant IV MFCentral sends separately by email. Must be exactly 16 bytes in UTF-8.
mfc.iv=

# JWK Set JSON files: your RSA private key, and MFCentral's public key for verifying responses.
mfc.private-key-file=${user.home}/.mfcentral/private.jwks.json
mfc.public-key-file=${user.home}/.mfcentral/mfc-public.jwks.json
